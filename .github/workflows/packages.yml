name: Packages

# Builds the Pikmin 1 downloads upstream publishes (Linux tarball and
# AppImage, Windows zip, Android APK) plus the macOS zip. Every push builds
# them all as artifacts; pushing a tag also publishes them as a GitHub release.
#
# The game lives in games/pikmin1 since the Fusion layout; Pikmin 2 has no
# release packages upstream yet.

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

env:
  SDL2_VERSION: "2.32.10"
  GAME_DIR: games/pikmin1

jobs:
  linux:
    # packaging/linux/build-release.sh builds in an Ubuntu 20.04 podman
    # container with SDL2 and the C++ runtime linked statically, and writes
    # both the tarball and the AppImage.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build release packages
        run: ${GAME_DIR}/packaging/linux/build-release.sh --clean
      - uses: actions/upload-artifact@v4
        with:
          name: nectar-linux
          path: |
            ${{ env.GAME_DIR }}/packaging/linux/out/nectar-linux.tar.gz
            ${{ env.GAME_DIR }}/packaging/linux/out/Open_Nectar-x86_64.AppImage

  linux-smoke:
    # The executables may only need glibc, libGL and libX11 from the system:
    # check they resolve on a clean, older distro with just those installed.
    needs: linux
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nectar-linux
      - name: Install the documented runtime
        run: apt-get update && apt-get install -y --no-install-recommends libgl1 libx11-6
      - name: Package runs on clean Debian 12
        run: |
          tar -xzf nectar-linux.tar.gz
          cd nectar-linux
          ./nectar-launcher --help
          for exe in nectar nectar-pal nectar-launcher; do
            if ldd "./${exe}" | grep 'not found'; then
              echo "Unresolved dependencies in ${exe}"
              exit 1
            fi
          done

  windows:
    # Cross-compiled with MinGW-w64, as packaging/windows expects.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y cmake mingw-w64 zip
      - name: Use the POSIX thread model
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Fetch SDL2 for MinGW
        # Not committed; the script expects the official SDL release here.
        run: |
          curl -fsSL -o sdl2-mingw.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          tar -xzf sdl2-mingw.tar.gz
          rm -rf "${GAME_DIR}/third_party/SDL2-mingw64"
          mkdir -p "${GAME_DIR}/third_party/SDL2-mingw64"
          cp -R "SDL2-${SDL2_VERSION}/x86_64-w64-mingw32/." "${GAME_DIR}/third_party/SDL2-mingw64/"
      - name: Build standalone package
        run: ${GAME_DIR}/packaging/windows/package-standalone.sh --clean
      - name: Archive package
        run: (cd "${GAME_DIR}/packaging/windows/out" && zip -qr "${GITHUB_WORKSPACE}/nectar-windows.zip" nectar-windows)
      - uses: actions/upload-artifact@v4
        with:
          name: nectar-windows
          path: nectar-windows.zip

  macos:
    runs-on: macos-15
    env:
      # Homebrew's SDL bottles only load on the macOS version they were built
      # for, so SDL2 is built here with the same deployment target as the game.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install ninja
      - name: Cache SDL2
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdl2
          key: sdl2-${{ env.SDL2_VERSION }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-arm64
      - name: Build SDL2
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o sdl2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          tar -xzf sdl2.tar.gz
          cmake -S "SDL2-${SDL2_VERSION}" -B sdl2-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/sdl2" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build sdl2-build
          cmake --install sdl2-build
      - name: Build standalone package
        # Builds USA and PAL, runs the offline tests, bundles SDL, signs ad hoc
        # and checks the package loads with no build-machine paths.
        run: ${GAME_DIR}/packaging/macos/package-standalone.sh --clean --sdl-prefix "${RUNNER_TEMP}/sdl2"
      - name: Archive package
        # ditto keeps execute permissions and code signatures, and Finder
        # extracts the result with a double-click.
        run: ditto -c -k --keepParent "${GAME_DIR}/packaging/macos/out/nectar-macos" nectar-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nectar-macos-arm64
          path: nectar-macos-arm64.zip

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: games/pikmin1/android/**/*.gradle*
      - name: Install SDK packages
        # The versions android/app/build.gradle asks for.
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=${ANDROID_HOME}" > "${GAME_DIR}/android/local.properties"
      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            {
              echo "storeFile=${RUNNER_TEMP}/release.jks"
              echo "storePassword=${KEYSTORE_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS}"
              echo "keyPassword=${KEY_PASSWORD}"
            } > "${GAME_DIR}/android/keystore.properties"
            echo "flags=" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a debug key."
            echo "flags=--debug-key" >> "${GITHUB_OUTPUT}"
          fi
      - name: Build APK
        run: ${GAME_DIR}/packaging/android/package-apk.sh ${{ steps.signing.outputs.flags }}
      - name: Remove signing material
        if: always()
        run: rm -f "${GAME_DIR}/android/keystore.properties" "${RUNNER_TEMP}/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: open-nectar-apk
          path: |
            ${{ env.GAME_DIR }}/packaging/android/out/*.apk
            ${{ env.GAME_DIR }}/packaging/android/out/*.apk.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, linux-smoke, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify every platform is present
        run: |
          ls -la dist
          for pattern in nectar-linux.tar.gz Open_Nectar-x86_64.AppImage nectar-windows.zip nectar-macos-arm64.zip 'open_nectar_*.apk'; do
            if ! compgen -G "dist/${pattern}" > /dev/null; then
              echo "Missing ${pattern}"
              exit 1
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
